<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img">
<style>
.tw,.blink,.fl,.wr,.pop,.bob,.tagA,.tagB,.img,.pen,.hl,.strike,.up,.sun,.wand,.star,.pic,.mt,.scan,.hit,.mer,.mer2,.cur,.typ{transform-box:fill-box}
.tw{transform-origin:50% 50%;animation:tw 2s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(1) rotate(0);opacity:1}50%{transform:scale(.5) rotate(45deg);opacity:.45}}
.blink{transform-origin:50% 50%;animation:blink 3s infinite}
@keyframes blink{0%,86%,100%{transform:scaleY(1)}91%{transform:scaleY(.1)}}
.fl{animation:fl 3s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.wr{transform-origin:0% 50%;animation:wr 6s ease-in-out infinite}
@keyframes wr{0%,6%{transform:scaleX(0)}16%,88%{transform:scaleX(1)}96%,100%{transform:scaleX(0)}}
.pop{transform-origin:50% 100%;animation:pop 6s ease-out infinite}
.bob{transform-origin:50% 100%;animation:bob 6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
@keyframes pop{0%{transform:scale(0);opacity:0}6%{transform:scale(1.15);opacity:1}10%,88%{transform:scale(1);opacity:1}95%,100%{transform:scale(.4);opacity:0}}
@keyframes bob{0%,4%,20%,100%{transform:translateY(0) rotate(0)}8%{transform:translateY(-4px) rotate(-5deg)}14%{transform:translateY(-2px) rotate(4deg)}}
.pop{opacity:0}
</style>
