name: Optimize panel summary GIF

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/optimize-panel-summary-gif.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GIF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gifsicle ffmpeg

      - name: Optimize panel summary GIF
        shell: bash
        run: |
          set -euo pipefail
          src="public/newfeaturedemo1 (1).gif"
          out="public/newfeaturedemo1-optimized.gif"
          tmp="/tmp/panel-summary-optimized.gif"

          echo "Original:"
          ls -lh "$src"
          file "$src"

          ffmpeg -hide_banner -loglevel error -y -i "$src"             -filter_complex "[0:v]fps=12,scale=456:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=128:stats_mode=diff[p];[s1][p]paletteuse=dither=bayer:bayer_scale=3:diff_mode=rectangle"             -loop 0 "$tmp"

          gifsicle -O3 --lossy=30 "$tmp" -o "$out"

          echo "Optimized:"
          ls -lh "$out"
          file "$out"

      - name: Commit optimized GIF
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "public/newfeaturedemo1-optimized.gif"
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Optimize panel summary email GIF"
          git push origin HEAD:main
